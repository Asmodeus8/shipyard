name: shipyard

services:
  app:
    build:
      context: ./app
      args:
        APP_VERSION: ${APP_VERSION:-local}
    environment:
      APP_ENV: local
      AWS_REGION: local
    read_only: true
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
